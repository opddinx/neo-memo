name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: node scripts/check.mjs
      - name: Core, CLI, and Store tests (Linux)
        if: runner.os != 'Windows'
        run: node --test tests/core.test.mjs
      - name: Store boundary tests (Windows)
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="Store|CLI|Item IDs|Asset identifiers|v1 data|Cache|App working directory|Symlinked" tests/core.test.mjs
      - name: Core behavior tests (Windows)
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="X URLs|tracking|Slack formatting|Duplicate|Offline note|Markdown|Corrupt|Manual tags|Incomplete AI|Content-addressed|Metadata|robots|private IPs|429|Pure private" tests/core.test.mjs
      - name: Writer lock test (Windows)
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="Writer lock" tests/core.test.mjs
      - name: Import concurrency test (Windows)
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="Capture stays" tests/core.test.mjs
      - name: Enrichment concurrency tests (Windows)
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="concurrent" tests/core.test.mjs
      - name: Cross-instance X lookup test (Windows)
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="X lookup" tests/core.test.mjs
      - name: Connector tests
        run: node --test tests/adapters.test.mjs
      - name: Git tests (Linux)
        if: runner.os != 'Windows'
        run: node --test tests/git.test.mjs
      - name: Git sync test (Windows)
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="remote sync" tests/git.test.mjs
      - name: Git divergence test (Windows)
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="Diverged" tests/git.test.mjs
      - name: Git staging boundary test (Windows)
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="Foreign staged" tests/git.test.mjs

      # The symlink rejection test self-skips on Windows because creating a
      # symlink normally requires Developer Mode or elevated privileges.
      # All tests use local fixtures; no connector or LLM API keys are needed.
